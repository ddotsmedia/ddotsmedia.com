name: CI/CD

on:
  pull_request:
  push:
    branches: [v2, main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to latest build on this branch)"
        required: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/ddotsmedia-web

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ddots_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ddotsmedia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddots_app -d ddotsmedia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ddots_app:ci_password@localhost:5432/ddotsmedia_ci
      BETTER_AUTH_SECRET: ci-only-secret-not-for-production-use-0000000000
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      OWNER_EMAIL: ci-owner@ddotsmedia.test
      OWNER_PASSWORD: ci-password-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Static generation (sitemap.ts, generateStaticParams) queries the DB at
    # build time — see Dockerfile's builder stage — so the image build needs
    # a reachable Postgres, same as a local `docker compose -f
    # docker-compose.prod.yml build` needs BUILD_DATABASE_URL.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ddots_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ddotsmedia_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ddots_app -d ddotsmedia_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://ddots_app:ci_password@localhost:5432/ddotsmedia_ci
      - id: meta
        run: echo "sha_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          network: host # lets the build container reach the postgres service on localhost
          build-args: |
            DATABASE_URL=postgres://ddots_app:ci_password@localhost:5432/ddotsmedia_ci
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name == 'main' && 'latest' || 'latest-staging' }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: true
          network: host
          build-args: |
            DATABASE_URL=postgres://ddots_app:ci_password@localhost:5432/ddotsmedia_ci
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:${{ steps.meta.outputs.sha_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-migrator:${{ github.ref_name == 'main' && 'latest' || 'latest-staging' }}
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          exit-code: "0" # report only — don't fail the pipeline on scan findings

  # Deploy is manual-only (workflow_dispatch) — no automatic VPS writes from CI
  # (BUILD_PLAN §1 / docs/DECISIONS.md: VPS changes require explicit owner go-ahead).
  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          TAG: ${{ inputs.image_tag || needs.build-and-push.outputs.image_tag }}
        run: |
          for attempt in 1 2 3; do
            ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new \
              "${{ secrets.DEPLOY_SSH_USER }}@${{ secrets.DEPLOY_SSH_HOST }}" bash -s "$TAG" <<'EOF' && break
            set -euo pipefail
            TAG="$1"
            cd /opt/ddotsmedia
            FREE_KB=$(df -Pk . | awk 'NR==2 {print $4}')
            if [ "$FREE_KB" -lt $((15 * 1024 * 1024)) ]; then
              echo "Disk gate failed: less than 15GB free" >&2
              exit 1
            fi
            PREV_TAG=$(grep -oP '(?<=:)[a-f0-9]+(?=$)' <(docker compose images web --format json | head -1) || echo "")
            ./scripts/backup.sh
            TAG="$TAG" docker compose -f docker-compose.prod.yml pull
            TAG="$TAG" docker compose -f docker-compose.prod.yml up -d
            for i in $(seq 1 12); do
              sleep 5
              if curl -fsS http://127.0.0.1:3082/api/health > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
            done
            echo "Health check failed after 60s — rolling back to $PREV_TAG" >&2
            if [ -n "$PREV_TAG" ]; then
              TAG="$PREV_TAG" docker compose -f docker-compose.prod.yml up -d
            fi
            exit 1
          EOF
            echo "SSH attempt $attempt failed, retrying..."
            sleep 5
          done

