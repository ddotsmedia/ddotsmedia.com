name: Deploy ddotsmedia.com

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-sha: ${{ steps.meta.outputs.image-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ddotsmedia.com:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/ddotsmedia.com:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract image SHA
        id: meta
        run: echo "image-sha=${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()
    steps:
      - name: Decode base64 SSH key
        id: ssh_key
        run: |
          DECODED_KEY=$(echo "${{ secrets.VPS_DEPLOY_KEY }}" | base64 -d 2>/dev/null || echo "${{ secrets.VPS_DEPLOY_KEY }}")
          echo "key<<EOF" >> $GITHUB_OUTPUT
          echo "$DECODED_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ steps.ssh_key.outputs.key }}

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_SHA: ${{ needs.build.outputs.image-sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -o StrictHostKeyChecking=no "$VPS_USER@$VPS_HOST" << DEPLOY_EOF
          set -e
          IMAGE="ghcr.io/ddotsmedia/ddotsmedia.com:$IMAGE_SHA"
          GITHUB_TOKEN="$GITHUB_TOKEN"
          TIMESTAMP=\$(date '+%Y-%m-%d %H:%M:%S')
          
          
          cat > .env.prod << 'ENVEOF'
          NODE_ENV=production
          PAYLOAD_PUBLIC_SERVER_URL=https://ddotsmedia.com
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          BETTER_AUTH_SECRET=${{ secrets.BETTER_AUTH_SECRET }}
          ENVEOF
          
          source .env.prod
          
          cat > docker-compose.yml << COMPOSEEOF
          version: '3.9'
          services:
            ddotsmedia-db:
              image: postgres:16-alpine
              container_name: ddotsmedia-db
              environment:
                POSTGRES_DB: ddotsmedia
                POSTGRES_PASSWORD: \${DB_PASSWORD}
                POSTGRES_USER: ddotsmedia
              volumes:
                - ddotsmedia-db-data:/var/lib/postgresql/data
              networks:
                - ddotsmedia-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U ddotsmedia -d ddotsmedia"]
                interval: 10s
                timeout: 5s
                retries: 5
          
            ddotsmedia-web:
              image: \${IMAGE}
              container_name: ddotsmedia-web
              depends_on:
                ddotsmedia-db:
                  condition: service_healthy
              environment:
                NODE_ENV: production
                PAYLOAD_PUBLIC_SERVER_URL: https://ddotsmedia.com
                DATABASE_URL: postgresql://ddotsmedia:\${DB_PASSWORD}@ddotsmedia-db:5432/ddotsmedia
                PAYLOAD_SECRET: \${PAYLOAD_SECRET}
                BETTER_AUTH_SECRET: \${BETTER_AUTH_SECRET}
              ports:
                - "127.0.0.1:3025:3000"
              networks:
                - ddotsmedia-network
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
                interval: 10s
                timeout: 5s
                retries: 3
          
          volumes:
            ddotsmedia-db-data:
              driver: local
          
          networks:
            ddotsmedia-network:
              driver: bridge
          COMPOSEEOF
          
          PREV_CONTAINER=\$(docker ps -q -f name=ddotsmedia-web || true)
          PREV_IMAGE=""
          if [ ! -z "\$PREV_CONTAINER" ]; then
            PREV_IMAGE=\$(docker inspect "\$PREV_CONTAINER" --format='{{.Config.Image}}')
          fi
          
          echo "[INFO] Logging into ghcr.io..."
          echo "\$GITHUB_TOKEN" | docker login ghcr.io -u ddotsmedia --password-stdin || {
            echo "[WARN] Docker login failed, attempting pull anyway..."
          }
          
          echo "[INFO] Pulling image: \\${IMAGE}"
          docker pull "\\${IMAGE}" || {
            echo "[ERROR] Failed to pull image"
            exit 1
          }
          
          echo "[INFO] Deploying at \${TIMESTAMP}"
          docker compose down --remove-orphans 2>&1 || true
          docker compose up -d || {
            echo "[ERROR] Failed to start containers"
            exit 1
          }
          
          sleep 10
          
          HEALTH_OK=false
          for i in {1..5}; do
            if curl -sf http://localhost:3025/api/health > /dev/null 2>&1; then
              echo "[OK] Health check passed (attempt \$i)"
              HEALTH_OK=true
              break
            fi
            echo "[WARN] Health check attempt \$i/5 failed, retrying in 5s..."
            sleep 5
          done
          
          if [ "\$HEALTH_OK" = false ]; then
            echo "[ERROR] Health checks failed after 5 attempts"
            echo "[DEBUG] Container logs:"
            docker compose logs --tail=50 || true
            
            echo "[ROLLBACK] Rolling back to previous image"
            docker compose down || true
            
            if [ ! -z "\$PREV_IMAGE" ] && [ ! -z "\$PREV_CONTAINER" ]; then
              echo "[ROLLBACK] Restarting previous container with image: \${PREV_IMAGE}"
              docker run -d \
                --name ddotsmedia-web-fallback \
                --network ddotsmedia-network \
                -p 127.0.0.1:3025:3000 \
                --restart unless-stopped \
                "\$PREV_IMAGE" || echo "[WARN] Rollback container start failed"
            fi
            
            exit 1
          fi
          
          echo "[SUCCESS] Deployment successful"
          echo "[\${TIMESTAMP}] Deployed \\${IMAGE}" >> deployments.log
          
          echo "[INFO] Configuring Nginx..."
          
          sudo tee /etc/nginx/sites-available/ddotsmedia.com > /dev/null << 'NGINXEOF'
          server {
              listen 80;
              server_name ddotsmedia.com www.ddotsmedia.com;
              
              location / {
                  proxy_pass http://127.0.0.1:3025;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection 'upgrade';
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_cache_bypass $http_upgrade;
              }
          }
          NGINXEOF
          
          sudo ln -sf /etc/nginx/sites-available/ddotsmedia.com /etc/nginx/sites-enabled/ddotsmedia.com
          
          if sudo nginx -t 2>&1 | grep -q "successful"; then
              echo "[OK] Nginx configuration is valid"
              sudo systemctl restart nginx || {
                  echo "[ERROR] Failed to restart Nginx"
                  exit 1
              }
              echo "[OK] Nginx restarted successfully"
          else
              echo "[ERROR] Nginx configuration test failed"
              sudo nginx -t
              exit 1
          fi
          
          sleep 2
          if netstat -tlnp 2>/dev/null | grep -q ":80 "; then
              echo "[OK] Nginx is listening on port 80"
          else
              echo "[WARN] Port 80 not detected in netstat, but Nginx may still be active"
          fi
          
          DEPLOY_EOF

      - name: Deployment Success
        if: success()
        run: |
          echo "✅ ddotsmedia.com deployed successfully"
          echo "Commit: ${{ github.sha }}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Deployment Failure
        if: failure()
        run: |
          echo "❌ Deployment failed and rolled back"
          echo "Commit: ${{ github.sha }}"
          exit 1
