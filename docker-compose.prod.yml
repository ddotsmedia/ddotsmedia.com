# Production deployment to 187.127.185.239
# Used by .github/workflows/deploy.yml
# Local test: `TAG=local docker compose -f docker-compose.prod.yml up -d`
name: ddotsmedia

services:
  web:
    image: ghcr.io/ddotsmedia/ddotsmedia-web:${TAG:-local}
    container_name: ddotsmedia-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEPLOY_PORT:-3082}:3000"
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      db:
        condition: service_healthy
    networks: [ddotsmedia]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    restart: unless-stopped
    volumes:
      - ./data/media:/app/media
      - ./data/private:/app/private

  db:
    image: postgres:17-alpine
    container_name: ddotsmedia-db
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_USER: ddots_app
      POSTGRES_DB: ddotsmedia
    volumes:
      - ddotsmedia_pgdata:/var/lib/postgresql/data
    networks: [ddotsmedia]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddots_app -d ddotsmedia"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped

networks:
  ddotsmedia:
    driver: bridge

volumes:
  ddotsmedia_pgdata:
